<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUVE DECOR | متجر الديكور</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<div class="container header-content">
<h1>NUVE DECOR</h1>
<button id="cart-btn" class="cart-toggle">

                🛒 السلة (<span id="cart-count">0</span>)
</button>
</div>
</header>
<main class="container">
<section class="hero">
<h2>لمسات ديكور عصرية لمنزلك</h2>
<p>اختر القطعة المناسبة، حدد اللون والكمية، واطلبها مباشرة عبر واتساب</p>
</section>
<section id="products-container" class="products-grid">
</section>
</main>
<aside id="cart-sidebar" class="cart-sidebar">
<div class="cart-header">
<h3>سلة المشتريات</h3>
<button id="close-cart" class="close-btn">✖</button>
</div>
<div id="cart-items" class="cart-items">
<p class="empty-msg">السلة فارغة حالياً</p>
</div>
<div class="cart-footer">
<div class="total-row">
<span>المجموع الكلي:</span>
<span id="cart-total">0.00 دينار</span>
</div>
<button id="whatsapp-order-btn" class="whatsapp-btn">

                إتمام الطلب عبر واتساب 💬
</button>
</div>
</aside>
<script src="script.js"></script>
</body>
</html>
